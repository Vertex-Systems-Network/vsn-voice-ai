name: Temporary Web Dependency Lockfile Resolution

on:
  push:
    branches:
      - work/wu014-directory-tenant-revalidation

permissions:
  contents: read

jobs:
  resolve-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Regenerate official lockfile from npm registry
        working-directory: apps/web
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies.next = '16.4.0';
          pkg.overrides = {...pkg.overrides, sharp: '0.35.5', 'source-map-js': '1.2.2'};
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Emit deterministic integrity-resolved files for GitHub connector handoff
        working-directory: apps/web
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          for (const [key,file] of [['PKG','package.json'],['LOCK','package-lock.json']]) {
            const data=fs.readFileSync(file);
            const encoded=data.toString('base64');
            console.log('FILE_SHA|'+key+'|'+crypto.createHash('sha256').update(data).digest('hex'));
            for (let i=0;i<encoded.length;i+=1400)
              console.log('FILE_B64|'+key+'|'+Math.floor(i/1400)+'|'+encoded.slice(i,i+1400));
            console.log('FILE_END|'+key+'|'+Math.ceil(encoded.length/1400));
          }
          NODE
