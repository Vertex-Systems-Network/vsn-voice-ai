name: Web Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22.23.2'

      - name: Install exact web dependencies
        working-directory: apps/web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck web workspace
        working-directory: apps/web
        run: npm run typecheck

      - name: Test web workspace contracts
        working-directory: apps/web
        run: npm test

      - name: Build web workspace
        working-directory: apps/web
        run: npm run build

      - name: Install pinned Chromium runtime
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E and responsive checks
        working-directory: apps/web
        run: npm run e2e
