name: API Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22.23.2"
      - name: Generate deterministic API lockfile
        working-directory: services/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload API lockfile for security pinning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-api-package-lock
          path: services/api/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install dependencies from generated lockfile
        working-directory: services/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit resolved API dependency tree
        working-directory: services/api
        run: npm audit --audit-level=high
      - name: Verify direct dependency pins
        working-directory: services/api
        run: npm ls --depth=0
      - name: Lint, typecheck and unit test API
        working-directory: services/api
        run: npm run check
