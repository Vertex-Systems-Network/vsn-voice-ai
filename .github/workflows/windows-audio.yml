name: Windows Audio Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/audio-core/**"
      - "native/windows-audio/**"
      - "native/windows-virtual-mic/**"
      - "scripts/windows/**"
      - "packages/contracts/schemas/windows-audio-*.schema.json"
      - "tests/fixtures/windows-audio-performance-samples.json"
      - "tests/test_windows_audio_controlled_*.py"
      - ".github/workflows/windows-audio.yml"
      - ".github/workflows/windows-audio-controlled.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/audio-core/**"
      - "native/windows-audio/**"
      - "native/windows-virtual-mic/**"
      - "scripts/windows/**"
      - "packages/contracts/schemas/windows-audio-*.schema.json"
      - "tests/fixtures/windows-audio-performance-samples.json"
      - "tests/test_windows_audio_controlled_*.py"
      - ".github/workflows/windows-audio.yml"
      - ".github/workflows/windows-audio-controlled.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-audio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-audio:
    name: windows-audio
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Compile Windows audio crate
        shell: pwsh
        run: cargo +1.98.1 check --locked -p vsn-windows-audio --all-targets

      - name: Lint Windows audio crate
        shell: pwsh
        run: cargo +1.98.1 clippy --locked -p vsn-windows-audio --all-targets -- -D warnings

      - name: Test Windows audio crate
        shell: pwsh
        run: cargo +1.98.1 test --locked -p vsn-windows-audio

      - name: Verify controlled runner syntax and hosted rejection
        shell: pwsh
        run: |
          $runner = (Resolve-Path "scripts/windows/run-controlled-windows-audio-verification.ps1").Path
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $runner,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Controlled Windows verification runner contains PowerShell parse errors."
          }

          try {
            & $runner `
              -ControlledChecksFile "hosted-runner-must-reject-before-reading.json" `
              -PerformanceSamplesFile "hosted-runner-must-reject-before-reading.json" `
              -RepositorySha "${{ github.sha }}"
            throw "Hosted runner was unexpectedly accepted as a controlled machine."
          }
          catch {
            if ($_.Exception.Message -notlike "*only on an explicitly targeted self-hosted runner*") {
              throw
            }
          }

      - name: Verify controlled performance summarizer contract
        shell: pwsh
        run: |
          ./scripts/windows/summarize-windows-audio-performance.ps1 `
            -InputFile tests/fixtures/windows-audio-performance-samples.json `
            -OutputFile artifacts/windows-audio-performance-measurements-fixture.json

          $summary = Get-Content -LiteralPath artifacts/windows-audio-performance-measurements-fixture.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$summary.sample_count -ne 20) {
            throw "Performance summarizer fixture produced an unexpected sample_count"
          }
          if ([Math]::Abs([double]$summary.processed_path_latency_p95_ms - 28.0) -gt 0.000001) {
            throw "Performance summarizer fixture produced an unexpected processed-path p95"
          }
          if ([Math]::Abs([double]$summary.callback_jitter_p95_ms - 1.9) -gt 0.000001) {
            throw "Performance summarizer fixture produced an unexpected jitter p95"
          }
          if ([Math]::Abs([double]$summary.safe_bypass_transition_p95_ms - 118.0) -gt 0.000001) {
            throw "Performance summarizer fixture produced an unexpected safe-bypass p95"
          }

      - name: Restore pinned Windows Driver Kit packages
        shell: pwsh
        working-directory: native/windows-virtual-mic/driver
        run: nuget restore packages.config -PackagesDirectory packages -Source "https://api.nuget.org/v3/index.json" -NonInteractive

      - name: Build KMDF virtual microphone control skeleton
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the Windows runner"
          }

          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "A Visual Studio installation with MSVC x64 tools was not found"
          }

          $msbuild = Join-Path $installation "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            throw "MSBuild.exe was not found at $msbuild"
          }

          & $msbuild "native\windows-virtual-mic\driver\vsn_virtual_mic_control.vcxproj" /m /t:Build /p:Configuration=Debug /p:Platform=x64 /p:SignMode=Off /v:minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $driver = Get-ChildItem "native\windows-virtual-mic\driver" -Recurse -Filter "vsn_virtual_mic_control.sys" | Select-Object -First 1
          if (-not $driver) {
            throw "KMDF build completed without producing vsn_virtual_mic_control.sys"
          }
          Write-Host "Built control-driver skeleton: $($driver.FullName)"

      - name: Build and verify virtual microphone test package
        shell: pwsh
        run: |
          $driver = Get-ChildItem "native\windows-virtual-mic\driver" -Recurse -Filter "vsn_virtual_mic_control.sys" | Select-Object -First 1
          if (-not $driver) {
            throw "WDK build output was not found for package verification"
          }

          ./scripts/windows/build-virtual-mic-test-package.ps1 -DriverBinary $driver.FullName

          if (-not (Test-Path "artifacts\vsn-virtual-mic-test-package\vsn_virtual_mic.cat")) {
            throw "Verified driver package did not contain the generated catalog"
          }

      - name: Validate C++ virtual microphone transport contracts
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the Windows runner"
          }

          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "A Visual Studio installation with MSVC x64 tools was not found"
          }

          $devCmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat was not found at $devCmd"
          }

          $compileAndRun = "`"$devCmd`" -no_logo -arch=x64 && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\protocol_abi_test.cpp /Fe:virtual_mic_protocol_abi_test.exe && virtual_mic_protocol_abi_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\cursor_sync_test.cpp /Fe:virtual_mic_cursor_sync_test.exe && virtual_mic_cursor_sync_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\shared_section_test.cpp /Fe:virtual_mic_shared_section_test.exe && virtual_mic_shared_section_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\device_control_abi_test.cpp /Fe:virtual_mic_device_control_abi_test.exe && virtual_mic_device_control_abi_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\ring_consumer_test.cpp /Fe:virtual_mic_ring_consumer_test.exe && virtual_mic_ring_consumer_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\wavert_contract_test.cpp /Fe:virtual_mic_wavert_contract_test.exe && virtual_mic_wavert_contract_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\wavert_stream_contract_test.cpp /Fe:virtual_mic_wavert_stream_contract_test.exe && virtual_mic_wavert_stream_contract_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\wavert_scheduler_test.cpp /Fe:virtual_mic_wavert_scheduler_test.exe && virtual_mic_wavert_scheduler_test.exe"
          & cmd.exe /d /c $compileAndRun
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Compile installed endpoint runtime smoke harness and collect evidence
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the Windows runner"
          }

          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "A Visual Studio installation with MSVC x64 tools was not found"
          }

          $devCmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat was not found at $devCmd"
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $compile = "`"$devCmd`" -no_logo -arch=x64 && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\installed_runtime_smoke.cpp /Fe:artifacts\virtual_mic_installed_runtime_smoke.exe /link ole32.lib"
          & cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          ./scripts/windows/collect-virtual-mic-verification-evidence.ps1 `
            -SmokeExecutable artifacts/virtual_mic_installed_runtime_smoke.exe `
            -PackageDirectory artifacts/vsn-virtual-mic-test-package `
            -OutputFile artifacts/windows-audio-verification-evidence.json `
            -RepositorySha "${{ github.sha }}" `
            -AllowVerificationRequired

          Get-Content -LiteralPath artifacts/windows-audio-verification-evidence.json

      - name: Retain Windows audio verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-audio-verification-${{ github.run_id }}
          path: artifacts/windows-audio-verification-evidence.json
          if-no-files-found: warn
          retention-days: 14
