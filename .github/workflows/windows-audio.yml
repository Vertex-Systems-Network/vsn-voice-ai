name: Windows Audio Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/audio-core/**"
      - "native/windows-audio/**"
      - "native/windows-virtual-mic/**"
      - ".github/workflows/windows-audio.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/audio-core/**"
      - "native/windows-audio/**"
      - "native/windows-virtual-mic/**"
      - ".github/workflows/windows-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-audio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-audio:
    name: windows-audio
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Compile Windows audio crate
        shell: pwsh
        run: cargo +1.98.1 check -p vsn-windows-audio --all-targets

      - name: Lint Windows audio crate
        shell: pwsh
        run: cargo +1.98.1 clippy -p vsn-windows-audio --all-targets -- -D warnings

      - name: Test Windows audio crate
        shell: pwsh
        run: cargo +1.98.1 test -p vsn-windows-audio

      - name: Restore pinned Windows Driver Kit packages
        shell: pwsh
        working-directory: native/windows-virtual-mic/driver
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Build KMDF virtual microphone control skeleton
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the Windows runner"
          }

          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "A Visual Studio installation with MSVC x64 tools was not found"
          }

          $msbuild = Join-Path $installation "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            throw "MSBuild.exe was not found at $msbuild"
          }

          & $msbuild "native\windows-virtual-mic\driver\vsn_virtual_mic_control.vcxproj" /m /t:Build /p:Configuration=Debug /p:Platform=x64 /p:SignMode=Off /v:minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $driver = Get-ChildItem "native\windows-virtual-mic\driver" -Recurse -Filter "vsn_virtual_mic_control.sys" | Select-Object -First 1
          if (-not $driver) {
            throw "KMDF build completed without producing vsn_virtual_mic_control.sys"
          }
          Write-Host "Built control-driver skeleton: $($driver.FullName)"

      - name: Validate C++ virtual microphone transport contracts
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the Windows runner"
          }

          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "A Visual Studio installation with MSVC x64 tools was not found"
          }

          $devCmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat was not found at $devCmd"
          }

          $compileAndRun = "`"$devCmd`" -no_logo -arch=x64 && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\protocol_abi_test.cpp /Fe:virtual_mic_protocol_abi_test.exe && virtual_mic_protocol_abi_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\cursor_sync_test.cpp /Fe:virtual_mic_cursor_sync_test.exe && virtual_mic_cursor_sync_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\shared_section_test.cpp /Fe:virtual_mic_shared_section_test.exe && virtual_mic_shared_section_test.exe && cl.exe /nologo /std:c++17 /permissive- /W4 /WX /EHsc /I native\windows-virtual-mic\include native\windows-virtual-mic\tests\device_control_abi_test.cpp /Fe:virtual_mic_device_control_abi_test.exe && virtual_mic_device_control_abi_test.exe"
          & cmd.exe /d /c $compileAndRun
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
