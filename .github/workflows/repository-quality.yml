name: AI Native Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-native-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/realtime-gateway/go.mod
          cache: false

      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Install pinned ANPOS validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-anpos.txt

      - name: Compile repository scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run control-plane conformance unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate current AI-native state and workflow safety
        run: python scripts/validate_ai_native_repo.py

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l services/realtime-gateway)"
          if [ -n "$unformatted" ]; then
            echo "Go files require gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Test realtime gateway
        working-directory: services/realtime-gateway
        run: go test ./...

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint native audio core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test native audio core
        run: cargo test --workspace

      - name: Validate product JSON Schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in sorted(Path("packages/contracts/schemas").glob("*.schema.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"valid schema: {path}")
          PY

      - name: Run protected-base validator against proposed tree
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:scripts/validate_ai_native_repo.py" > scripts/.trusted-base-validator.py
          python scripts/.trusted-base-validator.py
          rm -f scripts/.trusted-base-validator.py

      - name: Report control-plane changes for review evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD -- \
            AGENTS.md .ai .github blueprints scripts schemas tests config/coordination config/protocol \
            config/security config/consent config/github config/quality config/runtime config/release \
            CONTROL-PLANE-SECURITY.md PRODUCTION-ASSURANCE.md DESIGN-DATA-OPERATIONS.md \
            AUTO-AGENT.md SUPERVISOR.md ORCHESTRATOR.md MULTI-AGENT-ORCHESTRATION.md || true

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }' \
            .github/dependabot.yml .github/workflows/*.yml

      - name: Reject trailing whitespace in machine/code files
        shell: bash
        run: |
          if git grep -nE '[[:blank:]]+$' -- '*.py' '*.go' '*.rs' '*.toml' '*.json' '*.yml' '*.yaml'; then
            echo 'Trailing whitespace found in machine/code files.' >&2
            exit 1
          fi

      - name: Show repository integrity success
        run: echo 'Repository integrity, conformance tests, Go/Rust tests, product JSON Schemas, workflow pinning, JSON, and YAML checks passed.'
