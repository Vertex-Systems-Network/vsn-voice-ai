name: ANPOS Vendor Commercial Source Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout vendor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned ANPOS validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Compile vendor source scripts/tests
        run: python -m compileall -q scripts tests

      - name: Run vendor source-management tests
        run: python -m unittest tests.test_vendor_repository_export tests.test_vendor_handoff tests.test_commercial_launch_package tests.test_marketplace_staged_launch tests.test_operator_launch_bootstrap tests.test_deployment_identity -v

      - name: Validate vendor export, handoff, commercial launch, staged Marketplace strategy, operator bootstrap and deployment identity
        run: |
          python scripts/validate_vendor_repository_export.py
          python scripts/validate_commercial_launch_package.py
          python scripts/validate_marketplace_staged_launch.py
          python scripts/validate_operator_launch_bootstrap.py
          python scripts/validate_deployment_identity.py

      - name: Run protected-base vendor validators when available
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:scripts/validate_vendor_repository_export.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_vendor_repository_export.py" > scripts/.trusted-base-vendor-export-validator.py
            python scripts/.trusted-base-vendor-export-validator.py
            rm -f scripts/.trusted-base-vendor-export-validator.py
          else
            echo 'Base predates vendor export validator; current validator plus protected review remain required.'
          fi

          if git cat-file -e "${BASE_SHA}:scripts/validate_commercial_launch_package.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_commercial_launch_package.py" > scripts/.trusted-base-commercial-launch-validator.py
            python scripts/.trusted-base-commercial-launch-validator.py
            rm -f scripts/.trusted-base-commercial-launch-validator.py
          else
            echo 'Base predates commercial launch package validator; current validator plus protected review remain required.'
          fi

          if git cat-file -e "${BASE_SHA}:scripts/validate_marketplace_staged_launch.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_marketplace_staged_launch.py" > scripts/.trusted-base-marketplace-staged-validator.py
            python scripts/.trusted-base-marketplace-staged-validator.py
            rm -f scripts/.trusted-base-marketplace-staged-validator.py
          else
            echo 'Base predates Marketplace staged launch validator; current validator plus protected review remain required.'
          fi

          if git cat-file -e "${BASE_SHA}:scripts/validate_operator_launch_bootstrap.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_operator_launch_bootstrap.py" > scripts/.trusted-base-operator-bootstrap-validator.py
            python scripts/.trusted-base-operator-bootstrap-validator.py
            rm -f scripts/.trusted-base-operator-bootstrap-validator.py
          else
            echo 'Base predates operator launch bootstrap validator; current validator plus protected review remain required.'
          fi

          if git cat-file -e "${BASE_SHA}:scripts/validate_deployment_identity.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_deployment_identity.py" > scripts/.trusted-base-deployment-identity-validator.py
            python scripts/.trusted-base-deployment-identity-validator.py
            rm -f scripts/.trusted-base-deployment-identity-validator.py
          else
            echo 'Base predates deployment identity validator; current validator plus protected review remain required.'
          fi
